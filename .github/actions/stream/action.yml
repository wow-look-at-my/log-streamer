name: 'Stream build output'
description: 'Run a command with its output streamed to log-streamer, readable while the run is still in flight'

inputs:
  run:
    description: 'Command to run. Streamed to the server and still written to this job log.'
    required: true
  server:
    description: 'log-streamer server URL (ws:// or wss://).'
    required: false
    default: 'wss://logs.pazer.io'
  stream-key:
    description: 'Shared key the stream token derives from. Whoever watches needs the same key.'
    required: true
  name:
    description: 'Extra context separating streams inside a job. Matrix legs MUST set this, or every leg writes to the same stream.'
    required: false
    default: ''
  working-directory:
    description: 'Directory to run the command in'
    required: false
    default: '.'

outputs:
  token:
    description: 'The derived stream token, which a holder of the key computes without reading this log'
    value: ${{ steps.derive.outputs.token }}

runs:
  using: composite
  steps:
    # buildhost resolves the runner's own os and arch, and retries a registry blip.
    - name: Install the log-streamer client
      id: client
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: log-streamer/ls-client

    # Derived, never announced: a minted token's only channel back is this withheld log.
    - name: Run the command
      id: derive
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LOG_STREAMER_STREAM_KEY: ${{ inputs.stream-key }}
        LOG_STREAMER_SERVER: ${{ inputs.server }}
        STREAM_NAME: ${{ inputs.name }}
        STEP_SCRIPT: ${{ inputs.run }}
      run: |
        set -euo pipefail
        tok="$("${{ steps.client.outputs.path }}" token derive --name "${STREAM_NAME}")"
        echo "::add-mask::${tok}"
        echo "token=${tok}" >> "${GITHUB_OUTPUT}"
        script="${RUNNER_TEMP}/log-streamer-step-$$.sh"
        printf '%s\n' "${STEP_SCRIPT}" > "${script}"
        LOG_STREAMER_TOKEN="${tok}" "${{ steps.client.outputs.path }}" shell "${script}"
