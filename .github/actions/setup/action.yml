name: 'Stream a whole job'
description: 'Install the client and point the job at a stream, so every run step in the job streams live'

inputs:
  server:
    description: 'log-streamer server URL (ws:// or wss://).'
    required: false
    default: 'wss://logs.pazer.io'
  stream-key:
    description: 'Shared key the stream token derives from. Whoever watches needs the same key.'
    required: true
  name:
    description: 'Extra context separating streams inside a job. Matrix legs MUST set this, or every leg writes to the same stream.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # buildhost resolves the runner's own os and arch, and retries a registry blip.
    - name: Install the log-streamer client
      id: client
      uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@master
      with:
        project: log-streamer/ls-client

    # The client derives its own token from the key, so no log or output holds one.
    - name: Point the job's steps at the stream
      shell: bash
      env:
        KEY: ${{ inputs.stream-key }}
        STREAM_NAME: ${{ inputs.name }}
        SERVER: ${{ inputs.server }}
      run: |
        set -euo pipefail
        dirname "${{ steps.client.outputs.path }}" >> "${GITHUB_PATH}"
        echo "LOG_STREAMER_STREAM_KEY=${KEY}" >> "${GITHUB_ENV}"
        echo "LOG_STREAMER_NAME=${STREAM_NAME}" >> "${GITHUB_ENV}"
        echo "LOG_STREAMER_SERVER=${SERVER}" >> "${GITHUB_ENV}"
